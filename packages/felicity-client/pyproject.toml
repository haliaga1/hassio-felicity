[project]
name = "felicity-client"
version = "0.1.0"
description = "Async client for the Felicity Solar FSolar (Shine) cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hugoaliaga" }]
keywords = ["felicity", "solar", "inverter", "home-assistant", "fsolar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/hugoaliaga/felicity-metrics"
Repository = "https://github.com/hugoaliaga/felicity-metrics"
Issues = "https://github.com/hugoaliaga/felicity-metrics/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felicity_client"]
